[project]
name = "cerberus-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "cow-co", email = "cow-co@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "fastapi-csrf-protect>=1.0.7",
    "httpx2>=2.16.0",
    "psycopg>=3.3.6",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.48",
]

[build-system]
requires = ["uv_build>=0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "cyclonedx-bom>=7.6.0",
    "pyrefly>=1.4.0",
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.3",
]
