name: OV Scan

on:
  pull_request:
    branches: ["master"]
  push:
    branches: [ "master" ]
    tags:
      - v*

permissions:
  # Required to upload SARIF file to CodeQL. See: https://github.com/github/codeql-action/issues/2117
  actions: read
  # Require writing security events to upload SARIF file to security tab
  security-events: write
  # Only need to read contents
  contents: read

jobs:
  scan-pr:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./cerberus_backend
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36"
    with:
      scan-args: |-
        -L cerberus_backend/uv.lock