name: CERBERUS CI

on:
  pull_request:
    branches: ["master"]
  push:
    branches: [ "master" ]
    tags:
      - v*

jobs:
  scan-pr:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36"
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./cerberus_backend

    permissions:
      actions: read
      security-events: write
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.13.6"
    - name: Setup python
      run: uv python install
    - name: Install the project
      run: uv sync --no-build --locked --no-cache --all-extras --exclude-newer "1 week" --dev
    - name: Run tests
      run: uv run --no-build --locked --no-cache --all-extras --exclude-newer "1 week" pytest
    - name: Set up Docker Buildx
      if: github.ref_type == 'tag'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Build Backend Docker Image
      if: github.ref_type == 'tag'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        push: false
        tags: cerberus/backend:latest
    - name: Export Backend Image
      if: github.ref_type == 'tag'
      run: docker save -o cerberus-backend.tar cerberus/backend:latest
    - name: Upload Backend Image
      if: github.ref_type == 'tag'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create ${{github.ref_name}} -t ${{github.ref_name}} -d cerberus-backend.tar

  build-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./frontend

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up PNPM
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
      with:
        version: 12.0.0
    - name: Build Prod Release of Frontend
      run: pnpm run build
    - name: Set up Docker Buildx
      if: github.ref_type == 'tag'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Build Frontend Docker Image
      if: github.ref_type == 'tag'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        push: false
        tags: cerberus/frontend:latest
    - name: Export Frontend Image
      if: github.ref_type == 'tag'
      run: docker save -o cerberus-frontend.tar cerberus/frontend:latest
    - name: Upload Frontend Image
      if: github.ref_type == 'tag'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create ${{github.ref_name}} -t ${{github.ref_name}} -d cerberus-frontend.tar