name: CERBERUS CI

on:
  pull_request:
    branches: ["master"]
  merge_group:
    branches: ["master"]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./backend

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
        cache: maven
    - name: Run Backend Tests via Maven
      run: pwd && mvn -B clean test --file pom.xml
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
      with:
        directory: ./backend
    - name: Set up Docker Buildx
      if: github.ref_type == 'tag'
      uses: docker/setup-buildx-action@v4
    - name: Build Backend Docker Image
      if: github.ref_type == 'tag'
      uses: docker/build-push-action@v7
      with:
        push: false
        tags: cerberus/backend:latest
    - name: Export Backend Image
      if: github.ref_type == 'tag'
      run: docker save -o cerberus-backend.tar cerberus/backend:latest
    - name: Upload Backend Image
      if: github.ref_type == 'tag'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create ${{github.ref_name}} -t ${{github.ref_name}} -d cerberus-backend.tar

  build-frontend:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Set up PNPM
      uses: pnpm/setup@v3
      with:
        version: 12.0.0
    - name: Build Prod Release of Frontend
      run: ls -la && pnpm run build
    - name: Build Frontend Docker Image
      if: github.ref_type == 'tag'
      uses: docker/build-push-action@v7
      with:
        push: false
        tags: cerberus/frontend:latest
    - name: Export Frontend Image
      if: github.ref_type == 'tag'
      run: docker save -o cerberus-frontend.tar cerberus/frontend:latest
    - name: Upload Frontend Image
      if: github.ref_type == 'tag'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create ${{github.ref_name}} -t ${{github.ref_name}} -d cerberus-frontend.tar